[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "managed-skills"
version = "0.1.0"
description = "Install and remove dotfiles-managed Agent Skills"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.scripts]
managed-skills = "managed_skills.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

