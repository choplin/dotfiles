# Copy this file to ~/.config/skills/local.yaml and use absolute paths.
# The local file is intentionally not managed by dotfiles.
repositories:
  my-agent-skills:
    path: /absolute/path/to/my-agent-skills

projects:
  - path: /absolute/path/to/a/project
    installs:
      - name: project-structure-tools
        repository: my-agent-skills
        paths:
          - skills/codebase-structure
          - skills/refactoring-tools
        # Overrides defaults.agents for this install only.
        agents:
          - claude-code
          - codex
