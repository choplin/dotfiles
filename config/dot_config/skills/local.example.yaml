# Copy this file to ~/.config/skills/local.yaml and use absolute paths.
# The local file is intentionally not managed by dotfiles.
sources:
  my-agent-skills:
    path: /absolute/path/to/my-agent-skills
  # These augment matching remote sources in skills.yaml. Normal installs use
  # their URLs; `managed-skills run` uses these local checkouts.
  explainer-studio:
    checkout: /absolute/path/to/explainer-studio
  document-writing-skills:
    checkout: /absolute/path/to/document-writing-skills

packages:
  project-structure-tools:
    source: my-agent-skills
    paths:
      - skills/codebase-structure
      - skills/refactoring-tools

installs:
  - package: project-structure-tools
    target: /absolute/path/to/a/project
    # Overrides defaults.agents for this install only.
    agents:
      - claude-code
      - codex
