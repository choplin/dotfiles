defaults:
  agents:
    - claude-code
    - codex
    - opencode

sources:
  vercel-skills:
    url: https://github.com/vercel-labs/skills

  wtm:
    url: https://github.com/choplin/wtm

  llm-wiki:
    url: https://github.com/choplin/llm-wiki

  explainer-studio:
    url: https://github.com/choplin/explainer-studio

  japanese-tech-writing:
    url: https://gist.github.com/fd287c3133457c4fd8f5601d34aa817d.git

  cognitive-rhythm-writing:
    url: https://gist.github.com/eb2929f13ed19c97188393d297be8432.git

  awesome-copilot:
    url: https://github.com/github/awesome-copilot

  obra-the-elements-of-style:
    url: https://github.com/obra/the-elements-of-style

packages:
  my-agent-skills:
    source: my-agent-skills
    paths:
      - skills
    exclude:
      - 3d-print

  vercel-skills:
    source: vercel-skills
    skills: ["*"]

  wtm:
    source: wtm
    skills: ["*"]

  llm-wiki:
    source: llm-wiki
    skills: ["*"]

  explainer-studio:
    source: explainer-studio
    skills: ["*"]

  japanese-tech-writing:
    source: japanese-tech-writing

  cognitive-rhythm-writing:
    source: cognitive-rhythm-writing

  documentation-writer:
    source: awesome-copilot
    skills: ["documentation-writer"]

  writing-clearly-and-concisely:
    source: obra-the-elements-of-style
    skills: ["writing-clearly-and-concisely"]

installs:
  - package: my-agent-skills
    target: global

  - package: vercel-skills
    target: global

  - package: wtm
    target: global

  - package: llm-wiki
    target: global

  - package: explainer-studio
    target: global

  - package: japanese-tech-writing
    target: global

  - package: cognitive-rhythm-writing
    target: global

  - package: documentation-writer
    target: global

  - package: writing-clearly-and-concisely
    target: global
