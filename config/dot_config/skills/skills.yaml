defaults:
  agents:
    - claude-code
    - codex
    - opencode

sources:
  vercel-skills:
    url: https://github.com/vercel-labs/skills

  wtm:
    url: https://github.com/choplin/wtm

  llm-wiki:
    url: https://github.com/choplin/llm-wiki

  explainer-studio:
    url: https://github.com/choplin/explainer-studio

  awesome-copilot:
    url: https://github.com/github/awesome-copilot

  herdr:
    url: https://github.com/herdrdev/herdr

packages:
  my-agent-skills:
    source: my-agent-skills
    paths:
      - skills
    exclude:
      - 3d-print
      - obsidian-capture
      - obsidian-import-pdf

  vercel-skills:
    source: vercel-skills
    skills: ["*"]

  wtm:
    source: wtm
    skills: ["*"]

  llm-wiki:
    source: llm-wiki
    skills: ["*"]

  explainer-studio:
    source: explainer-studio
    skills: ["*"]

  documentation-writer:
    source: awesome-copilot
    skills: ["documentation-writer"]

  herdr:
    source: herdr
    skills: ["herdr"]

installs:
  - package: my-agent-skills
    target: global

  - package: vercel-skills
    target: global

  - package: wtm
    target: global

  - package: llm-wiki
    target: global

  - package: explainer-studio
    target: global

  - package: documentation-writer
    target: global

  - package: herdr
    target: global
